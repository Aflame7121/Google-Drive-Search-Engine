[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    -v
    --doctest-modules
    --strict-markers

markers =
    unit: marks unit tests
    integration: marks integration tests
    slow: marks slow tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning